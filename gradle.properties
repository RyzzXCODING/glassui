# GlassUI build properties
# Target: Minecraft 1.21.11, Fabric Loader 0.19.5, Java 21

# Minecraft version (exact target)
minecraft_version=1.21.11

# Fabric Loader version (user target)
loader_version=0.19.5

# Fabric API version (must support 1.21.11 and HudElementRegistry)
fabric_api_version=0.141.6+1.21.11

# ModMenu (compile-only; 17.0.1 supports Minecraft >=1.21.11 <26)
modmenu_version=17.0.1

# Mod metadata
mod_version=1.3.23
maven_group=com.glassui
archives_base_name=glassui

# Mappings: intermediary (reconstructed source retains intermediary member names)
# Loom 1.19.3 or later supports Minecraft 1.21.11
